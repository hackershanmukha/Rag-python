[project]
name = "rag-python"
version = "0.1.0"
description = "A lightweight, modular Retrieval-Augmented Generation (RAG) system with FAISS, Sentence Transformers, and Groq"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.1",
    "ipykernel>=7.4.0",
    "langchain>=1.4.7",
    "langchain-community>=0.4.2",
    "langchain-core>=1.7.3",
    "langchain-groq>=1.1.3",
    "langchain-ollama>=1.1.0",
    "pymupdf>=2.0",
    "pypdf>=6.21.4",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.2.0",
]
